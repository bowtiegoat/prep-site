<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exam Deep Dive | BowtieGOAT · GOATS get GLASS</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="images/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-cream-50 text-ink-900 antialiased min-h-screen">
  <header data-header class="bg-cream-50/90 border-b border-ink-200"></header>

  <main class="max-w-5xl mx-auto px-4 py-10">
    <a href="results.html" class="text-sm text-blue-600 hover:underline">← My Results</a>
    <h1 class="mt-2 font-serif text-3xl sm:text-4xl font-bold">Exam Deep Dive</h1>
    <p class="mt-2 text-ink-600">Where your points are hiding, based on every exam you've taken and how DECA builds its exams.</p>

    <div class="mt-6 flex flex-wrap items-center gap-x-4 gap-y-2">
      <div data-levels class="inline-flex rounded-lg border border-ink-300 bg-white overflow-hidden" role="group" aria-label="Competition level"></div>
      <p data-next class="text-sm text-ink-600"></p>
    </div>

    <div data-body class="mt-8 space-y-6"><p class="text-sm text-ink-500">Loading…</p></div>
  </main>

  <script type="module">
    import { collection, doc, getDoc, getDocs, query, where } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
    import { db, requireUser, renderHeader, esc, linkify, isViewingAs, today, loadIcdc } from './js/app.js';
    import { firstCompetition } from './js/competitions.js';
    import { areaOf } from './js/missed.js';
    import { firstAttempts } from './js/attempts.js';
    import { takesExam } from './js/events.js';
    import {
      LEVELS, MIN_TAKERS, accuracy, answerLetters, blueprint, cheapestPoints, examsAtLevel, levelComparison,
      mostTestedPis, piRecord, piStatus, pointsAtStake, projectedScore, projectionTrend, questionResults,
      readingList, repeatMisses, topQuarterScore,
    } from './js/insights.js';

    const { user, profile } = await requireUser();
    renderHeader({ user, profile, active: 'results' });
    const $ = (sel) => document.querySelector(sel);
    const body = $('[data-body]');

    // Events with no cluster exam have nothing to analyze here.
    if (!takesExam(profile.eventCode)) {
      body.innerHTML = empty("Your event doesn't take a cluster exam", `${esc(profile.eventName)} is judged without a cluster exam, so there's nothing to analyze here.`, '<a href="eventhub.html" class="mt-4 inline-block rounded-lg bg-ink-900 text-cream-50 px-5 py-2.5 font-medium">Go to the Event Hub</a>');
      await new Promise(() => {});
    }

    // ---------- Load ----------
    const attemptFilters = [where('uid', '==', user.uid), ...(isViewingAs() ? [where('schoolId', '==', profile.schoolId)] : [])];
    const [attemptSnap, questionSnap, schoolSnap, icdc] = await Promise.all([
      getDocs(query(collection(db, 'attempts'), ...attemptFilters)),
      getDocs(query(collection(db, 'examQuestions'), where('cluster', '==', profile.cluster))),
      getDoc(doc(db, 'schools', profile.schoolId)).catch(() => null),
      loadIcdc(),
    ]);
    const questions = new Map(questionSnap.docs.map((d) => [d.id, d.data()]));
    // Same exams as My Results: this event's cluster, current track, and not switched off there.
    const excluded = new Set(profile.excludedAttempts || []);
    let attempts = attemptSnap.docs.map((d) => ({ id: d.id, ...d.data() }))
      .filter((a) => a.track === profile.track && questions.has(a.examId) && !excluded.has(a.id));
    // Retakes: only each exam's first try counts here (what the student knew at first).
    attempts = firstAttempts(attempts);
    const stats = new Map();
    await Promise.all([...questions.keys()].map(async (id) => {
      try { const s = await getDoc(doc(db, 'examStats', id)); if (s.exists()) stats.set(id, s.data()); } catch {}
    }));

    // ---------- Which competition is next ----------
    const dates = schoolSnap?.exists() ? schoolSnap.data().competitionDates : null;
    const first = firstCompetition(profile.eventCode, dates);
    const upcoming = [];
    if (first?.level === 'district' && dates?.district) upcoming.push({ level: 'Districts', label: 'District/Regional', date: dates.district });
    if (dates?.state) upcoming.push({ level: 'States', label: 'State/Provincial', date: dates.state });
    if (icdc?.start) upcoming.push({ level: 'ICDC', label: 'ICDC', date: icdc.start });
    // Without the school's dates, start at District.
    const next = dates?.state ? upcoming.find((u) => u.date >= today()) : null;
    const available = LEVELS.filter((L) => examsAtLevel(questions, L.key).length);
    let level = (next && available.some((L) => L.key === next.level) ? next.level : available[0]?.key) || 'Districts';

    if (next) {
      const days = Math.round((new Date(`${next.date}T12:00`) - new Date(`${today()}T12:00`)) / 86400000);
      const when = new Date(`${next.date}T12:00`).toLocaleDateString(undefined, { month: 'long', day: 'numeric' });
      $('[data-next]').textContent = `Next up: ${next.label} · ${when} · ${days >= 14 ? `${Math.floor(days / 7)} weeks away` : days === 0 ? 'today' : `${days} day${days === 1 ? '' : 's'} away`}`;
    } else if (!dates) {
      $('[data-next]').textContent = "Your advisor hasn't set your competition dates yet, so District is shown first.";
    }

    function empty(title, text, extra = '') {
      return `<div class="rounded-2xl border-2 border-dashed border-ink-200 bg-white p-8 text-center">
        <h2 class="font-serif text-2xl font-bold">${title}</h2><p class="mt-2 text-ink-600">${text}</p>${extra}</div>`;
    }

    function renderLevels() {
      $('[data-levels]').innerHTML = available.map((L, i) => `
        <button type="button" data-level="${L.key}" aria-pressed="${L.key === level}"
          class="px-4 py-2 text-sm font-semibold ${i ? 'border-l border-ink-300' : ''} aria-pressed:bg-ink-900 aria-pressed:text-cream-50 hover:bg-ink-50 aria-pressed:hover:bg-ink-900">${L.name}</button>`).join('');
    }
    $('[data-levels]').addEventListener('click', (e) => {
      const b = e.target.closest('[data-level]');
      if (!b) return;
      level = b.dataset.level;
      renderLevels();
      render();
    });

    // ---------- Render ----------
    let piFilter = 'all';
    const results = questionResults(attempts, questions);
    const acc = accuracy(results);
    const record = piRecord(results);
    const card = (inner, extra = '') => `<section class="rounded-2xl bg-white border border-ink-200 p-5 sm:p-6 ${extra}">${inner}</section>`;
    const kicker = (text) => `<p class="text-xs font-semibold uppercase tracking-[0.15em] text-ink-500">${text}</p>`;
    const percent = (x) => (x == null ? '—' : `${Math.round(x * 100)}%`);

    function render() {
      const L = LEVELS.find((x) => x.key === level);
      const bp = blueprint(questions, level);
      const projected = projectedScore(bp, acc);
      const target = topQuarterScore(questions, stats, level);
      body.innerHTML = [
        projectionCard(L, bp, projected, target),
        stakesCard(L, bp),
        piCard(L),
        `<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">${repeatCard()}${readingCard()}</div>`,
        cheapCard(),
        levelsCard(),
        lettersCard(),
      ].join('');
    }

    function projectionCard(L, bp, projected, target) {
      const others = LEVELS.filter((x) => available.some((a) => a.key === x.key)).map((x) => {
        const p = projectedScore(blueprint(questions, x.key), acc);
        return `<span class="${x.key === level ? 'font-semibold text-ink-900' : ''}">${x.name}: ${p ?? '—'}</span>`;
      }).join(' · ');
      return card(`
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-start">
          <div>
            ${kicker(`Projected ${esc(L.name)} score`)}
            <p class="mt-1 font-serif text-5xl font-bold tabular-nums">${projected ?? '—'}<span class="text-xl text-ink-400"> / 100</span></p>
            <p class="mt-2 text-sm text-ink-600">If you took a ${esc(L.long)} exam today, based on ${attempts.length} exam${attempts.length === 1 ? '' : 's'} (${results.length} questions) and how DECA weights each area at this level.</p>
            <p class="mt-2 text-sm text-ink-500">${others}</p>
            ${target != null ? `<p class="mt-2 text-sm">Top 25% on the site: <strong>${target}</strong>${projected != null ? ` · ${projected >= target ? 'you\'re there' : `${target - projected} to go`}` : ''}</p>` : ''}
          </div>
          <div class="md:col-span-2">${trendChart(projectionTrend(attempts, questions, level), target)}</div>
        </div>`);
    }

    // Projected score after each exam: one line, plus a dashed top-25% line.
    function trendChart(points, target) {
      if (points.length < 2) return '<p class="text-sm text-ink-500 md:pt-6">Take another exam to see your projected score change over time.</p>';
      const W = 560; const H = 200; const padL = 32; const padR = 16; const padT = 12; const padB = 28;
      const values = points.map((p) => p.projected).concat(target ?? []);
      const lo = Math.max(0, Math.floor((Math.min(...values) - 10) / 10) * 10);
      const hi = Math.min(100, Math.ceil((Math.max(...values) + 5) / 10) * 10);
      const x = (i) => padL + (i * (W - padL - padR)) / (points.length - 1);
      const y = (v) => padT + ((hi - v) * (H - padT - padB)) / (hi - lo);
      const grid = [lo, Math.round((lo + hi) / 2), hi].map((v) => `
        <line x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}" stroke="#e4e9f0" />
        <text x="${padL - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#586a8c">${v}</text>`).join('');
      const line = points.map((p, i) => `${i ? 'L' : 'M'}${x(i)},${y(p.projected)}`).join(' ');
      const short = (d) => (d ? d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '');
      return `
        <svg viewBox="0 0 ${W} ${H}" class="w-full h-auto" role="img" aria-label="Projected score after each exam">
          ${grid}
          ${target != null && target >= lo && target <= hi ? `<line x1="${padL}" x2="${W - padR}" y1="${y(target)}" y2="${y(target)}" stroke="#2f3b56" stroke-dasharray="4 4" />
            <text x="${W - padR}" y="${y(target) - 6}" text-anchor="end" font-size="11" fill="#2f3b56">Top 25%</text>` : ''}
          <path d="${line}" fill="none" stroke="#1f72a3" stroke-width="2" />
          ${points.map((p, i) => `
            <circle cx="${x(i)}" cy="${y(p.projected)}" r="5" fill="#1f72a3" stroke="#fff" stroke-width="2"><title>${esc(short(p.date))} · after ${esc(p.exam)}: ${p.projected}</title></circle>
            <text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#586a8c">${esc(short(p.date))}</text>`).join('')}
        </svg>
        <p class="text-xs text-ink-500">Your projected score after each exam you took. Point at a dot for details.</p>`;
    }

    function stakesCard(L, bp) {
      const rows = pointsAtStake(bp, acc);
      const max = Math.max(...rows.map((r) => r.lost), 1);
      return card(`
        ${kicker('Where your points are')}
        <h2 class="mt-1 font-serif text-xl font-bold">Study these first for ${esc(L.name)}</h2>
        <p class="mt-1 text-sm text-ink-600">Each ${esc(L.long)} exam has the same number of questions per area every year. Points at stake = questions on the exam × your miss rate in that area.</p>
        <div class="mt-4 overflow-x-auto">
          <table class="w-full min-w-[560px] text-sm">
            <thead><tr class="text-left text-xs uppercase tracking-wider text-ink-500">
              <th class="py-2 pr-3">Instructional area</th><th class="py-2 pr-3 text-right">Questions</th><th class="py-2 pr-3 text-right">You got right</th><th class="py-2 w-1/3">Points at stake</th>
            </tr></thead>
            <tbody>${rows.map((r) => `
              <tr class="border-t border-ink-100">
                <td class="py-2 pr-3">${esc(r.area)}</td>
                <td class="py-2 pr-3 text-right tabular-nums">${r.questions}</td>
                <td class="py-2 pr-3 text-right tabular-nums">${r.estimated ? '<span class="text-ink-400" title="You haven\'t seen this area yet; your overall rate is used">not seen</span>' : `${percent(r.accuracy)} <span class="text-xs text-ink-400">of ${r.seen}</span>`}</td>
                <td class="py-2"><span class="flex items-center gap-2"><span class="h-3 rounded-r bg-blue-500" style="width:${Math.max(2, (r.lost / max) * 100)}%"></span><span class="tabular-nums text-ink-700">${r.lost.toFixed(1)}</span></span></td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>`);
    }

    function piCard(L) {
      const { examCount, pis } = mostTestedPis(questions, level);
      if (!pis.length) return '';
      const STATUS = {
        missed: { label: 'Missed', cls: 'bg-rose-100 text-rose-700' },
        mixed: { label: 'Mixed', cls: 'bg-tan-100 text-tan-700' },
        unseen: { label: 'Not seen yet', cls: 'bg-ink-100 text-ink-600' },
        mastered: { label: 'Got it', cls: 'bg-blue-100 text-blue-700' },
      };
      const rows = pis.map((p) => ({ ...p, rec: record.get(p.code), status: piStatus(record.get(p.code)) }));
      const counts = Object.fromEntries(Object.keys(STATUS).map((k) => [k, rows.filter((r) => r.status === k).length]));
      const shown = rows.filter((r) => piFilter === 'all' || r.status === piFilter);
      const chip = (key, label, n) => `<button type="button" data-pi-filter="${key}" aria-pressed="${piFilter === key}" class="rounded-full border border-ink-300 px-3 py-1 text-xs font-semibold aria-pressed:bg-ink-900 aria-pressed:text-cream-50 aria-pressed:border-ink-900">${label} (${n})</button>`;
      return card(`
        ${kicker('Most-tested performance indicators')}
        <h2 class="mt-1 font-serif text-xl font-bold">${pis.length} PIs that keep coming back</h2>
        <p class="mt-1 text-sm text-ink-600">These PIs appeared on at least half of the ${examCount} ${esc(L.name)} exams on the site. The same PIs show up year after year, so they're your best bet.</p>
        <div class="mt-3 flex flex-wrap gap-2">
          ${chip('all', 'All', rows.length)}${chip('missed', 'Missed', counts.missed)}${chip('mixed', 'Mixed', counts.mixed)}${chip('unseen', 'Not seen yet', counts.unseen)}${chip('mastered', 'Got it', counts.mastered)}
        </div>
        <div class="mt-3 overflow-x-auto max-h-[28rem] overflow-y-auto">
          <table class="w-full min-w-[560px] text-sm">
            <thead class="sticky top-0 bg-white"><tr class="text-left text-xs uppercase tracking-wider text-ink-500">
              <th class="py-2 pr-3">Performance indicator</th><th class="py-2 pr-3 text-right whitespace-nowrap">On exams</th><th class="py-2 pr-3">You</th>
            </tr></thead>
            <tbody>${shown.map((r) => `
              <tr class="border-t border-ink-100">
                <td class="py-2 pr-3"><span class="font-mono text-xs bg-ink-100 rounded px-1.5 py-0.5 whitespace-nowrap">${esc(r.code)}</span> ${esc(r.indicator)}</td>
                <td class="py-2 pr-3 text-right tabular-nums whitespace-nowrap">${r.exams} of ${examCount}</td>
                <td class="py-2 pr-3 whitespace-nowrap"><span class="rounded-full px-2 py-0.5 text-xs font-semibold ${STATUS[r.status].cls}">${STATUS[r.status].label}</span>${r.rec ? ` <span class="text-xs text-ink-500">${r.rec.seen - r.rec.missed} of ${r.rec.seen} right</span>` : ''}</td>
              </tr>`).join('') || '<tr><td colspan="3" class="py-4 text-ink-500">None in this group.</td></tr>'}
            </tbody>
          </table>
        </div>`);
    }

    function repeatCard() {
      const rows = repeatMisses(results).slice(0, 15);
      return card(`
        ${kicker('Repeat misses')}
        <h2 class="mt-1 font-serif text-xl font-bold">PIs you've missed more than once</h2>
        <p class="mt-1 text-sm text-ink-600">One miss can be a slip. Missing a PI again means it's a real gap.</p>
        ${rows.length ? `<ul class="mt-3 divide-y divide-ink-100 text-sm">${rows.map((r) => `
          <li class="py-2 flex gap-3 justify-between">
            <span><span class="font-mono text-xs bg-ink-100 rounded px-1.5 py-0.5">${esc(r.code)}</span> ${esc(r.indicator)}</span>
            <span class="shrink-0 font-semibold text-rose-700 whitespace-nowrap">${r.missed} of ${r.seen}</span>
          </li>`).join('')}</ul>` : '<p class="mt-3 text-sm text-ink-500">No repeat misses yet.</p>'}`);
    }

    function readingCard() {
      const rows = readingList(results).slice(0, 10);
      return card(`
        ${kicker('Reading list')}
        <h2 class="mt-1 font-serif text-xl font-bold">Sources behind your misses</h2>
        <p class="mt-1 text-sm text-ink-600">Many questions come from the same sources, especially LAPs. Reading one source can cover several misses.</p>
        ${rows.length ? `<ul class="mt-3 divide-y divide-ink-100 text-sm">${rows.map((r) => `
          <li class="py-2">
            <div class="flex gap-3 justify-between">
              <span class="min-w-0 break-words">${r.lap ? '<span class="mr-1 rounded bg-blue-100 text-blue-700 text-[11px] font-semibold px-1.5 py-0.5">LAP</span>' : ''}${linkify(r.source)}</span>
              <span class="shrink-0 font-semibold whitespace-nowrap">${r.missed} missed</span>
            </div>
            <p class="mt-0.5 text-xs text-ink-500">${[...r.codes].map(esc).join(', ')}</p>
          </li>`).join('')}</ul>` : '<p class="mt-3 text-sm text-ink-500">No misses yet.</p>'}`);
    }

    function cheapCard() {
      const rows = cheapestPoints(results, stats).slice(0, 15);
      const anyStats = [...stats.values()].some((s) => (s.questionTakers || 0) >= MIN_TAKERS);
      return card(`
        ${kicker('Cheapest points')}
        <h2 class="mt-1 font-serif text-xl font-bold">Questions most test-takers got right</h2>
        <p class="mt-1 text-sm text-ink-600">You missed these, but at least 70% of site test-takers got them right. They're usually the easiest points to win back.</p>
        ${rows.length ? `<div class="mt-3 overflow-x-auto"><table class="w-full min-w-[560px] text-sm">
          <thead><tr class="text-left text-xs uppercase tracking-wider text-ink-500"><th class="py-2 pr-3">Exam</th><th class="py-2 pr-3">Q#</th><th class="py-2 pr-3">Performance indicator</th><th class="py-2 text-right">Got it right</th></tr></thead>
          <tbody>${rows.map((r) => `
            <tr class="border-t border-ink-100">
              <td class="py-2 pr-3 whitespace-nowrap">${esc(r.exam)}</td>
              <td class="py-2 pr-3 tabular-nums">${r.q}</td>
              <td class="py-2 pr-3"><span class="font-mono text-xs bg-ink-100 rounded px-1.5 py-0.5 whitespace-nowrap">${esc(r.code)}</span> ${esc(r.indicator)}</td>
              <td class="py-2 text-right tabular-nums font-semibold">${percent(r.rate)} <span class="text-xs font-normal text-ink-400">of ${r.takers}</span></td>
            </tr>`).join('')}</tbody></table></div>`
          : `<p class="mt-3 text-sm text-ink-500">${anyStats ? 'None right now. Your misses are on the harder questions.' : `This needs at least ${MIN_TAKERS} test-takers per exam. Check back as more students take exams.`}</p>`}`);
    }

    function levelsCard() {
      const rows = levelComparison(attempts, questions, stats).filter((r) => r.exams);
      const bps = Object.fromEntries(LEVELS.map((L) => [L.key, blueprint(questions, L.key)]));
      const areas = [...new Set(LEVELS.flatMap((L) => [...bps[L.key].keys()]))]
        .map((p) => ({ p, counts: LEVELS.map((L) => bps[L.key].get(p) || 0) }))
        .sort((a, b) => b.counts[2] - b.counts[0] - (a.counts[2] - a.counts[0]));
      return card(`
        ${kicker('Moving up')}
        <h2 class="mt-1 font-serif text-xl font-bold">How you compare at each level</h2>
        <p class="mt-1 text-sm text-ink-600">Exams get harder from District to ICDC. When your scores at the next level match the site average there, you're ready for it.</p>
        <div class="mt-3 overflow-x-auto"><table class="w-full min-w-[480px] text-sm">
          <thead><tr class="text-left text-xs uppercase tracking-wider text-ink-500"><th class="py-2 pr-3">Level</th><th class="py-2 pr-3 text-right">Projected</th><th class="py-2 pr-3 text-right">Your average</th><th class="py-2 text-right">Site average</th></tr></thead>
          <tbody>${rows.map((r) => `
            <tr class="border-t border-ink-100 ${r.key === level ? 'font-semibold' : ''}">
              <td class="py-2 pr-3">${esc(r.long)}</td>
              <td class="py-2 pr-3 text-right tabular-nums">${projectedScore(bps[r.key], acc) ?? '—'}</td>
              <td class="py-2 pr-3 text-right tabular-nums">${r.yourAverage != null ? `${r.yourAverage}% <span class="text-xs font-normal text-ink-400">(${r.taken} exam${r.taken === 1 ? '' : 's'})</span>` : '<span class="text-ink-400 font-normal">none taken</span>'}</td>
              <td class="py-2 text-right tabular-nums">${r.siteAverage != null ? `${r.siteAverage}%` : '—'}</td>
            </tr>`).join('')}</tbody></table></div>
        <details class="mt-4">
          <summary class="cursor-pointer text-sm font-semibold text-blue-600">How the exam changes from District to ICDC</summary>
          <p class="mt-2 text-sm text-ink-600">Questions per area on each level's exam. Areas that grow at ICDC are at the top.</p>
          <div class="mt-2 overflow-x-auto"><table class="w-full min-w-[480px] text-sm">
            <thead><tr class="text-left text-xs uppercase tracking-wider text-ink-500"><th class="py-2 pr-3">Instructional area</th>${LEVELS.map((L) => `<th class="py-2 pr-3 text-right">${L.name}</th>`).join('')}</tr></thead>
            <tbody>${areas.map((a) => `
              <tr class="border-t border-ink-100"><td class="py-1.5 pr-3">${esc(areaOf(`${a.p}:`))}</td>${a.counts.map((n) => `<td class="py-1.5 pr-3 text-right tabular-nums">${n || '<span class="text-ink-300">0</span>'}</td>`).join('')}</tr>`).join('')}
            </tbody></table></div>
        </details>`);
    }

    function lettersCard() {
      const letters = answerLetters(questions);
      if (!letters) return '';
      const even = Math.max(...Object.values(letters)) - Math.min(...Object.values(letters)) <= 6;
      return card(`
        ${kicker('Myth check')}
        <h2 class="mt-1 font-serif text-xl font-bold">Is there a "most common" answer letter?</h2>
        <p class="mt-1 text-sm text-ink-600">${even
          ? `No. Across ${questions.size} ${esc(profile.cluster)} exams, the correct answers are spread almost evenly. When you're unsure, rule out wrong answers instead of guessing a letter.`
          : `Here's how the correct answers split across ${questions.size} ${esc(profile.cluster)} exams. Even so, ruling out wrong answers beats guessing a letter.`}</p>
        <div class="mt-3 grid grid-cols-4 gap-2 max-w-sm text-center text-sm">
          ${Object.entries(letters).map(([k, v]) => `<div class="rounded-lg bg-ink-50 py-2"><p class="font-bold text-lg">${k}</p><p class="tabular-nums text-ink-600">${v}%</p></div>`).join('')}
        </div>`);
    }

    // ---------- Start ----------
    if (!questions.size) {
      body.innerHTML = empty(`${esc(profile.cluster)} exams aren't on the site yet`, 'Once they are, this page will show where your points are hiding.');
    } else if (!attempts.length) {
      body.innerHTML = empty('Take an exam first', 'This page builds on your exam results. Take one from the Event Hub, then come back.', '<a href="eventhub.html" class="mt-4 inline-block rounded-lg bg-ink-900 text-cream-50 px-5 py-2.5 font-medium">Go to the Event Hub</a>');
    } else {
      renderLevels();
      render();
    }

    body.addEventListener('click', (e) => {
      const chip = e.target.closest('[data-pi-filter]');
      if (!chip) return;
      piFilter = chip.dataset.piFilter;
      render();
    });
  </script>
</body>
</html>
