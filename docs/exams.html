<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exams | BowtieGOAT · GOATS get GLASS</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/jpeg" href="images/logo.jpg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-cream-50 text-ink-900 antialiased min-h-screen">
  <header data-header class="bg-cream-50/90 border-b border-ink-200"></header>

  <main class="max-w-4xl mx-auto px-4 py-10">
    <p data-greeting class="text-sm font-semibold uppercase tracking-[0.15em] text-blue-600"></p>
    <h1 data-event-title class="mt-2 font-serif text-3xl sm:text-4xl font-bold"></h1>
    <p data-event class="mt-2 text-ink-600"></p>

    <div data-resources class="mt-6 grid grid-cols-1 sm:grid-cols-3 gap-3"></div>

    <h2 class="mt-12 font-serif text-2xl sm:text-3xl font-bold">Your cluster exams</h2>

    <div class="mt-4 rounded-xl bg-white border border-ink-200 p-5 text-sm text-ink-700">
      <strong>How it works:</strong> Have your printed exam ready, pick it below, and bubble in your answers here.
      You get 90 minutes, like the real thing. Nothing is recorded until you click <strong>Submit</strong>,
      and each exam can only be submitted once.
    </div>

    <div data-list class="mt-8 space-y-8">
      <p class="text-ink-500 text-sm">Loading exams…</p>
    </div>
  </main>

  <script type="module">
    import { collection, getDocs, query, where } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
    import { db, requireUser, renderHeader, esc, formatDate, compareExams } from './js/app.js';
    import { draftKey } from './js/drafts.js';
    import { EVENTS } from './js/events.js';
    import { EVENT_LINKS } from './js/event-links.js';

    const { user, profile } = await requireUser();
    renderHeader({ user, profile, active: 'exams' });

    document.querySelector('[data-greeting]').textContent = `Hi, ${profile.firstName}`;
    document.querySelector('[data-event-title]').textContent = profile.eventName;
    document.querySelector('[data-event]').innerHTML =
      `${esc(profile.eventCode)} · ${esc(profile.cluster)} cluster · <a href="profile.html" class="text-blue-600 underline">Change event</a>`;

    // Quick links for the student's event: DECA page, guidelines, DECA+.
    const event = EVENTS.find((e) => e.code === profile.eventCode);
    const links = EVENT_LINKS[profile.eventCode] || {};
    const resources = [
      { href: event?.url, icon: '🏛️', title: 'DECA event page', text: `The official ${event?.event || 'event'} overview from DECA.` },
      { href: links.guidelines, icon: '📄', title: 'Event guidelines', text: 'Rules, format, and scoring for this year (PDF).' },
      { href: links.decaPlus, icon: '⭐', title: 'DECA+ resources', text: "Practice materials. Sign in with your chapter's DECA+ account." },
    ].filter((r) => r.href);
    document.querySelector('[data-resources]').innerHTML = resources.map((r) => `
      <a href="${esc(r.href)}" target="_blank" rel="noopener noreferrer"
        class="group flex gap-3 rounded-xl border border-ink-200 bg-white p-4 hover:border-blue-500 hover:shadow-sm">
        <span class="text-2xl leading-none" aria-hidden="true">${r.icon}</span>
        <span>
          <span class="flex items-center gap-1 font-semibold text-ink-900 group-hover:text-blue-600">${esc(r.title)} <span aria-hidden="true" class="text-xs">↗</span></span>
          <span class="block mt-0.5 text-xs text-ink-500">${esc(r.text)}</span>
        </span>
      </a>`).join('');

    const [examSnap, attemptSnap] = await Promise.all([
      getDocs(query(collection(db, 'exams'), where('cluster', '==', profile.cluster))),
      getDocs(query(collection(db, 'attempts'), where('uid', '==', user.uid))),
    ]);
    const exams = examSnap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((e) => e.active !== false).sort(compareExams);
    const myAttempts = attemptSnap.docs
      .map((d) => ({ id: d.id, ...d.data() }))
      .filter((a) => a.track === profile.track);
    const attempts = new Map(myAttempts.filter((a) => a.cluster === profile.cluster).map((a) => [a.examId, a]));

    const list = document.querySelector('[data-list]');
    if (!exams.length) {
      list.innerHTML = `
        <div class="rounded-2xl border-2 border-dashed border-ink-200 bg-white p-8 text-center">
          <p class="text-3xl">🛠️</p>
          <h2 class="mt-2 font-serif text-2xl font-bold">Your cluster's exams are coming soon</h2>
          <p class="mt-2 text-ink-600">We're adding ${esc(profile.cluster)} exams next. Check back soon!</p>
        </div>`;
    } else {
      const years = [...new Set(exams.map((e) => e.year))];
      list.innerHTML = years.map((year) => `
        <section>
          <h2 class="font-serif text-xl font-bold text-ink-800">${esc(exams.find((e) => e.year === year).label.split(' ')[0])}</h2>
          <div class="mt-3 grid grid-cols-1 sm:grid-cols-3 gap-3">
            ${exams.filter((e) => e.year === year).map(card).join('')}
          </div>
        </section>`).join('');
    }

    // Completed exams from earlier events in a different cluster.
    const previousClusters = [...new Set(myAttempts.filter((a) => a.cluster !== profile.cluster).map((a) => a.cluster))];
    if (previousClusters.length) {
      list.insertAdjacentHTML('beforeend', `
        <div class="pt-6 border-t-2 border-dashed border-ink-200 space-y-8">
          ${previousClusters.map((cluster) => {
            const taken = myAttempts
              .filter((a) => a.cluster === cluster)
              .sort((a, b) => (b.submittedAt?.toMillis() || 0) - (a.submittedAt?.toMillis() || 0));
            const events = [...new Set(taken.map((a) => a.eventCode))]
              .map((code) => EVENTS.find((e) => e.code === code))
              .filter(Boolean)
              .map((e) => `${e.event} (${e.code})`);
            return `
              <section>
                <p class="text-xs font-semibold uppercase tracking-[0.15em] text-ink-500">Previous event</p>
                <h2 class="font-serif text-xl font-bold text-ink-800">${esc(events.join(', ') || cluster)}</h2>
                <p class="text-sm text-ink-500">${esc(cluster)} exams you completed. They're still in My Results.</p>
                <div class="mt-3 grid grid-cols-1 sm:grid-cols-3 gap-3">
                  ${taken.map((a) => `
                    <a href="result.html?id=${encodeURIComponent(a.id)}" class="block rounded-xl border border-ink-200 bg-ink-50 p-4 text-ink-500 hover:border-ink-300">
                      <p class="font-semibold">${esc(a.examLabel)}</p>
                      <p class="text-xs">${esc(a.examSubtitle)}</p>
                      <p class="mt-3 text-sm">✓ Taken ${esc(formatDate(a.submittedAt))}</p>
                      <p class="text-sm font-semibold text-ink-700">${a.correct}/${a.total} · See results →</p>
                    </a>`).join('')}
                </div>
              </section>`;
          }).join('')}
        </div>`);
    }

    function card(exam) {
      const attempt = attempts.get(exam.id);
      if (attempt) {
        return `
          <a href="result.html?id=${encodeURIComponent(attempt.id)}" class="block rounded-xl border border-ink-200 bg-ink-50 p-4 text-ink-500 hover:border-ink-300">
            <p class="font-semibold">${esc(exam.level)}</p>
            <p class="text-xs">${esc(exam.subtitle)}</p>
            <p class="mt-3 text-sm">✓ Taken ${esc(formatDate(attempt.submittedAt))}</p>
            <p class="text-sm font-semibold text-ink-700">${attempt.correct}/${attempt.total} · See results →</p>
          </a>`;
      }
      let inProgress = false;
      try { inProgress = !!localStorage.getItem(draftKey(user.uid, profile.track, exam.id)); } catch {}
      return `
        <a href="exam.html?id=${encodeURIComponent(exam.id)}" class="block rounded-xl border border-ink-300 bg-white p-4 hover:border-blue-500 hover:shadow-sm">
          <p class="font-semibold text-ink-900">${esc(exam.level)}</p>
          <p class="text-xs text-ink-500">${esc(exam.subtitle)}</p>
          <p class="mt-3 text-sm font-medium text-blue-600">${inProgress ? 'Resume exam →' : 'Start exam →'}</p>
        </a>`;
    }
  </script>
</body>
</html>
